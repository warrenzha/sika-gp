[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sika-gp"
version = "0.1.0"
description = "Sparse Inducing Kernel Approximation for Gaussian Process inference and Bayesian deep learning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Wenyuan Zhao" },
  { name = "Rui Tuo" },
  { name = "Chao Tian" }
]
dependencies = [
  "torch>=2.1",
  "gpytorch>=1.11",
  "linear-operator>=0.5",
  "numpy>=1.24",
  "scipy>=1.10"
]

[project.optional-dependencies]
examples = [
  "torchvision>=0.16",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "openpyxl>=3.1",
  "tensorboard>=2.14"
]
llm = [
  "datasets>=2.18",
  "transformers>=4.38"
]
notebooks = [
  "jupyterlab>=4.0",
  "ipykernel>=6.25",
  "ipywidgets>=8.1"
]

[project.urls]
Repository = "https://github.com/warrenzha/sika-gp"

[tool.setuptools.packages.find]
include = ["csgp*"]
